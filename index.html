<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tracking PPN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">
    <section class="hero">
      <h1>Tracking PPN</h1>
    </section>

    <section class="table-card">
      <div class="table-toolbar">
        <div class="toolbar-left">
          <strong>Data Tracking PPN</strong>
          <span id="dataCount">1 data</span>
        </div>
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Cari username / Trx ID..." autocomplete="off">
        </div>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Trx ID</th>
              <th>Jenis<br>PPN</th>
              <th>Nilai<br>Transaksi</th>
              <th>PPN</th>
              <th>Total<br>Transaksi</th>
              <th>Sisa PPN</th>
              <th>Progress</th>
            </tr>
          </thead>
          <tbody id="trackingBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" hidden>Data tidak ditemukan.</div>
    </section>

    <section class="controls-card">
      <div class="controls-head">
        <div>
          <h2>Pengaturan Data</h2>
          <p>Semua kontrol data berada di luar tabel.</p>
        </div>
        <span class="storage-status">● Local Storage</span>
      </div>
      <div class="controls-grid">
        <button class="btn primary" id="addBtn">＋ Tambah Data</button>
        <button class="btn" id="editBtn">✎ Edit Data</button>
        <button class="btn danger" id="deleteBtn">Hapus Data</button>
        <button class="btn" id="resetBtn">↻ Reset Data</button>
        <button class="btn" id="exportBtn">↓ Export JSON</button>
        <label class="btn file-btn">↑ Import JSON
          <input id="importInput" type="file" accept=".json,application/json">
        </label>
      </div>
      <div class="select-row">
        <label for="selectedId">Data yang dipilih</label>
        <select id="selectedId"></select>
      </div>
    </section>
  </main>

  <dialog id="dataDialog">
    <form id="dataForm" method="dialog">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle">Edit Data</h2>
          <p>Ubah data tracking sesuai kebutuhan.</p>
        </div>
        <button type="button" class="close-btn" id="closeBtn">×</button>
      </div>

      <div class="form-grid">
        <label>Username<input name="username" required></label>
        <label>Trx ID<input name="trxId" required></label>
        <label>Jenis PPN<input name="jenisPPN" required></label>
        <label>Persentase PPN (%)<input name="persentase" type="number" step="0.01" min="0"></label>
        <label>Nilai Transaksi<input name="nilaiTransaksi" type="number" step="1" min="0"></label>
        <label>Nilai PPN<input name="nilaiPPN" type="number" step="1" min="0"></label>
        <label>Total Transaksi<input name="totalTransaksi" type="number" step="1" min="0"></label>
        <label>Sisa PPN<input name="sisaPPN" type="number" step="1" min="0"></label>
        <label>Progress (%)<input name="progress" type="number" step="0.1" min="0" max="100"></label>
      </div>

      <label class="auto-calc">
        <input id="autoCalc" type="checkbox" checked>
        Hitung PPN & Total Transaksi otomatis dari Nilai Transaksi + Persentase PPN
      </label>

      <div class="modal-actions">
        <button type="button" class="btn" id="cancelBtn">Batal</button>
        <button type="submit" class="btn primary" id="saveBtn">Simpan Perubahan</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
